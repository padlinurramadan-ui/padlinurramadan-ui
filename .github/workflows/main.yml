name: generate animation

on:
  schedule:
    - cron: "0 */24 * * *" # Berjalan otomatis setiap 24 jam
  workflow_dispatch: # Agar bisa dijalankan manual kapan saja

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate-pacman-game-from-github-contribution-grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=yellow&color_dots=#bfd6f6,#8dbdff,#64a1ff,#4b91ff,#217aff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=yellow&color_dots=#bfd6f6,#8dbdff,#64a1ff,#4b91ff,#217aff

      - name: push github-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
